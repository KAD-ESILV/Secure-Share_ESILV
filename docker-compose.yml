# SecureShare - lance toute la plateforme avec : docker compose up --build
# Services : postgres (base), seaweedfs (stockage), api (Node.js), web (React)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # donnees gardees apres un redemarrage (NFR-REL-03)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    # pas de "ports" : la base n'est pas joignable depuis l'exterieur (SRS 6.4)

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - seaweeddata:/data                     # fichiers chiffres gardes apres un redemarrage
    networks: [backend]
    # pas de "ports" : le stockage n'est pas joignable depuis l'exterieur (SRS 6.4)

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://seaweedfs:8333
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks: [backend, frontend]

  web:
    build: ./web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [frontend]

volumes:
  pgdata:
  seaweeddata:

networks:
  backend:
  frontend:
